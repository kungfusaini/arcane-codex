<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Image Popup Model Prototype</title>
  <style>
    :root {
      --color-neutral: #191919;
      --color-ink: #f1f1ef;
      --color-muted: #d2d2cf;
      --color-border: #353535;
      --color-accent: #1f78d1;
      --color-accent-on: #ffffff;
      --color-card: #252525;
      --color-page: #202020;
      --color-page-muted: #2c2c2c;
      --color-danger: #eb5757;
      --shadow: rgba(0, 0, 0, 0.34);
      --radius-sm: 4px;
      --radius-md: 6px;
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-6: 24px;
      --space-8: 32px;
      --font-size-100: 12px;
      --font-size-200: 14px;
      --font-base: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif;
      --elevation-md: 0 8px 24px var(--shadow);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--color-neutral);
      color: var(--color-ink);
      font-family: var(--font-base);
      font-size: var(--font-size-200);
      line-height: 1.5;
      display: grid;
      place-items: center;
      padding: var(--space-8);
    }
    .stage {
      position: relative;
      width: min(980px, 100%);
      min-height: min(660px, calc(100vh - 64px));
      background: var(--color-page);
      overflow: visible;
    }
    .mock-page {
      width: min(680px, calc(100% - 96px));
      margin: 72px auto;
      color: var(--color-muted);
    }
    .mock-title { width: 58%; height: 40px; margin-bottom: var(--space-6); background: var(--color-page-muted); border-radius: var(--radius-sm); }
    .mock-line { height: 14px; margin-block: var(--space-3); background: var(--color-page-muted); border-radius: var(--radius-sm); }
    .mock-line:nth-child(2) { width: 84%; }
    .mock-line:nth-child(3) { width: 74%; }
    .mock-line:nth-child(4) { width: 62%; }

    .popup {
      position: absolute;
      top: 112px;
      left: 50%;
      transform: translateX(-50%);
      width: 360px;
      max-height: min(540px, calc(100vh - 160px));
      overflow-y: auto;
      padding: var(--space-2);
      border-radius: var(--radius-md);
      background: var(--color-card);
      box-shadow: var(--elevation-md);
    }
    .popup-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-2);
      padding: var(--space-1) var(--space-1) var(--space-2);
    }
    .popup-header strong { font-size: var(--font-size-200); font-weight: 650; }
    button {
      min-height: 32px;
      border: 0;
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--color-ink);
      padding: var(--space-1) var(--space-2);
      font: inherit;
      font-size: var(--font-size-200);
      line-height: 1.2;
      cursor: pointer;
    }
    button:hover { background: var(--color-page-muted); }
    button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
    .close { color: var(--color-muted); }
    .tabs {
      display: flex;
      gap: var(--space-1);
      padding: 0 var(--space-1) var(--space-2);
    }
    .tabs button { min-height: 28px; font-size: var(--font-size-100); color: var(--color-muted); }
    .tabs .active { background: var(--color-page-muted); color: var(--color-ink); }
    .panel {
      display: grid;
      gap: var(--space-2);
      padding: var(--space-2);
      border-radius: var(--radius-md);
      background: var(--color-card);
    }
    .section {
      display: grid;
      gap: var(--space-2);
      padding-block: var(--space-2);
    }
    .section + .section { border-top: 1px solid var(--color-border); }
    .section h3 { margin: 0; font-size: var(--font-size-200); font-weight: 600; }
    .section p { margin: 0; color: var(--color-muted); font-size: var(--font-size-100); line-height: 1.35; }
    .preview {
      height: 144px;
      border-radius: var(--radius-sm);
      background: #141414;
      border: 1px solid var(--color-border);
      display: grid;
      place-items: center;
      overflow: hidden;
    }
    .preview img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      display: block;
    }
    .field { display: grid; gap: var(--space-1); color: var(--color-muted); font-size: var(--font-size-100); }
    input, textarea {
      width: 100%; min-height: 36px; border: 1px solid transparent; border-radius: var(--radius-sm);
      background: var(--color-page-muted); color: var(--color-ink); padding: var(--space-2); font: inherit; font-size: var(--font-size-200);
    }
    textarea { min-height: 44px; resize: vertical; }
    .inline { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--space-2); align-items: end; }
    .row { display: flex; flex-wrap: wrap; gap: var(--space-1); }
    .primary { background: var(--color-accent); color: var(--color-accent-on); }
    .primary:hover { background: color-mix(in oklab, var(--color-accent) 88%, var(--color-ink)); }
    .prompt {
      padding: var(--space-2);
      border-radius: var(--radius-sm);
      background: var(--color-page-muted);
      color: var(--color-muted);
      font-size: var(--font-size-100);
    }
    .marker {
      display: inline-flex;
      width: fit-content;
      align-items: center;
      min-height: 22px;
      padding: 2px 6px;
      border-radius: var(--radius-sm);
      background: var(--color-page-muted);
      color: var(--color-muted);
      font-size: var(--font-size-100);
    }
    .editor-only { outline: 1px dashed var(--color-accent); outline-offset: 2px; }
    .published-hidden { opacity: .72; }
    .note {
      position: absolute;
      left: var(--space-4);
      bottom: var(--space-4);
      color: var(--color-muted);
      font-size: var(--font-size-100);
    }
    @media (max-width: 880px) {
      body { padding: var(--space-3); }
      .stage { min-height: 1100px; }
      .popup { position: static; transform: none; margin: var(--space-4) auto; }
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="mock-page" aria-hidden="true">
      <div class="mock-title"></div>
      <div class="mock-line"></div>
      <div class="mock-line"></div>
      <div class="mock-line"></div>
    </div>

    <section class="popup" aria-label="Image popup">
      <header class="popup-header">
        <strong>Image</strong>
        <button class="close" aria-label="Close">×</button>
      </header>

      <nav class="tabs editor-only published-hidden" aria-label="Popup pages">
        <button class="active">Info</button>
        <button>Settings</button>
      </nav>

      <div class="panel">
        <section class="section">
          <div class="preview">
            <img alt="Generated image preview" src="data:image/svg+xml;utf8,<?xml version='1.0'?><svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 420'><rect width='800' height='420' fill='%23141414'/><rect x='44' y='44' width='712' height='332' rx='12' fill='%232c2c2c'/><circle cx='238' cy='212' r='78' fill='%23eb5757'/><rect x='360' y='154' width='236' height='118' rx='10' fill='%231f78d1'/></svg>" />
          </div>
          <div class="row">
            <button class="primary">Open image</button>
          </div>
        </section>

        <section class="section">
          <h3>Generated with</h3>
          <div class="prompt">A quiet red cover image with a single object.</div>
        </section>

        <section class="section editor-only published-hidden">
          <span class="marker">Editor only: settings/actions hidden on published pages</span>
          <div class="row">
            <button>Replace</button>
            <button>AI edit</button>
            <button>Remove</button>
          </div>
        </section>
      </div>
    </section>

    <div class="note">Only the dashed section is editor-only.</div>
  </div>
</body>
</html>
